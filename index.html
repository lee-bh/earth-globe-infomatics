<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 지표 지구본</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: indicator index (left) · globe (center) · country sheet + ranked ledger (right); collapses to chips + stacked columns on narrow screens. */
:root {
  --bg: #f3f5f8;
  --panel: #fbfcfd;
  --ink: #0e1726;
  --ink-2: #4a5568;
  --ink-3: #6b7484;
  --rule: #dde3ea;
  --ocean: #eaedf1;
  --ocean-edge: #c9d4e1;
  --land-none: #d5d9df;
  --hatch: #8c95a3;
  --graticule: rgba(60, 90, 130, 0.10);
  --border: #f3f5f8;
  --focus: #0e1726;
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --ref: #8c95a3;
  --seq-1: #b7d3f6; --seq-2: #86b6ef; --seq-3: #5598e7; --seq-4: #2a78d6; --seq-5: #1c5cab; --seq-6: #0d366b;
  --shade: rgba(14, 23, 38, 0.18);
  --shine: rgba(255, 255, 255, 0.35);
  --tip-bg: #0e1726;
  --tip-ink: #f3f5f8;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111b; --panel: #111926; --ink: #edf1f6; --ink-2: #b4bdc9; --ink-3: #8b95a3; --rule: #223044;
    --ocean: #142033; --ocean-edge: #22324a; --land-none: #2c3542; --hatch: #6b7584;
    --graticule: rgba(160, 190, 230, 0.08); --border: #0b111b; --focus: #edf1f6; --accent: #5598e7;
    --accent-soft: rgba(85, 152, 231, 0.14); --ref: #6b7584;
    --seq-1: #143a6b; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #86b6ef; --seq-6: #cde2fb;
    --shade: rgba(0, 0, 0, 0.35); --shine: rgba(255, 255, 255, 0.07);
    --tip-bg: #edf1f6; --tip-ink: #0b111b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111b; --panel: #111926; --ink: #edf1f6; --ink-2: #b4bdc9; --ink-3: #8b95a3; --rule: #223044;
  --ocean: #142033; --ocean-edge: #22324a; --land-none: #2c3542; --hatch: #6b7584;
  --graticule: rgba(160, 190, 230, 0.08); --border: #0b111b; --focus: #edf1f6; --accent: #5598e7;
  --accent-soft: rgba(85, 152, 231, 0.14); --ref: #6b7584;
  --seq-1: #143a6b; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #86b6ef; --seq-6: #cde2fb;
  --shade: rgba(0, 0, 0, 0.35); --shine: rgba(255, 255, 255, 0.07);
  --tip-bg: #edf1f6; --tip-ink: #0b111b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1560px;
  margin: 0 auto;
  padding-inline: clamp(16px, 2.4vw, 32px);
  padding-block: 22px 40px;
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 18px; }
h1 { margin: 0; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
.tagline { margin: 0; color: var(--ink-3); font-size: 14px; }

/* Three columns */
.grid {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr) 380px;
  gap: 20px;
  align-items: start;
}
@media (max-width: 1180px) {
  .grid { grid-template-columns: minmax(0, 1fr) 360px; }
  .indicators { grid-column: 1 / -1; }
}
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; }
.label { font-size: 12px; letter-spacing: 0.06em; color: var(--ink-3); }

/* Left: indicator index */
.indicators { display: grid; gap: 16px; min-width: 0; align-content: start; }
.ind-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ind-btn {
  width: 100%; text-align: left; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline;
  padding: 12px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--rule); color: var(--ink);
  font: 15px var(--font-body);
}
.ind-btn:hover { border-color: var(--ink-3); }
.ind-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ind-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ind-name { font-weight: 600; }
.ind-group { font-size: 11px; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 7px; }
.ind-meta { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }

.about { padding: 16px; display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); }
.about h2 { margin: 0; font-size: 15px; color: var(--ink); }
.about p { margin: 0; }
.about ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.about h3 { margin: 4px 0 0; font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.06em; }

@media (max-width: 1180px) {
  .ind-list { grid-template-columns: repeat(auto-fill, minmax(min(200px, calc(50% - 3px)), 1fr)); }
  .ind-btn { padding: 10px 12px; }
  .about { display: none; }
  .about.inline { display: grid; grid-column: 1 / -1; }
}

/* Center: globe */
.stage { position: relative; min-width: 0; }
.globe-box { position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 76vh; margin-inline: auto; }
canvas#globe { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; outline: none; border-radius: 50%; }
canvas#globe.dragging { cursor: grabbing; }
canvas#globe:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.controls { position: absolute; top: 4px; right: 4px; display: flex; flex-direction: column; gap: 6px; }
.ctrl {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  font: 500 16px/1 var(--font-num); cursor: pointer; display: grid; place-items: center;
}
.ctrl:hover { border-color: var(--ink-3); }
.ctrl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctrl svg { width: 16px; height: 16px; }
.ctrl[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

.legend { margin-top: 12px; display: grid; gap: 8px; }
.legend-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; }
.lg-item { display: grid; gap: 4px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: var(--ink-2); cursor: default; font: 12px/1.2 var(--font-num); white-space: nowrap; }
.lg-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) { .lg-item { font-size: 10.5px; } }
.lg-swatch { height: 12px; border-radius: 2px; }
.lg-extra { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); }
.lg-extra span { display: inline-flex; align-items: center; gap: 6px; }
.chip { width: 14px; height: 12px; border-radius: 2px; display: inline-block; }
.chip.none { background: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, var(--land-none) 1.5px 5px); }
.chip.nodata { background: var(--land-none); }

/* Right: country sheet + ledger */
aside.side { display: grid; gap: 16px; min-width: 0; }
.sheet { padding: 18px 18px 16px; }
.detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.detail-name { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.detail-en { color: var(--ink-3); font-size: 13px; }
.rank-pill { font: 500 12px/1 var(--font-num); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 9px; white-space: nowrap; }
.big { margin: 14px 0 2px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.big .val { font: 500 clamp(30px, 3.4vw, 40px)/1 var(--font-num); letter-spacing: -0.02em; }
.big .unit { color: var(--ink-3); font-size: 14px; }
.compare { color: var(--ink-2); font-size: 13px; margin: 6px 0 0; }
.compare-bar { position: relative; height: 6px; background: var(--rule); border-radius: 3px; margin-top: 8px; }
.compare-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); }
.compare-bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.compare-scale { display: flex; justify-content: space-between; font: 11px var(--font-num); color: var(--ink-3); margin-top: 4px; }
dl.slip { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0 0; padding-top: 14px; border-top: 1px dashed var(--rule); font-size: 13px; }
dl.slip dt { color: var(--ink-3); }
dl.slip dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.note { margin: 12px 0 0; font-size: 13px; color: var(--ink-2); }
.status-none { margin: 14px 0 0; font-size: 15px; color: var(--ink-2); }

.trend { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
.trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.trend-head .label { letter-spacing: 0.02em; }
.trend-read { font: 12px var(--font-num); color: var(--ink-2); min-height: 1.4em; }
.trend svg { display: block; width: 100%; height: 132px; overflow: visible; touch-action: pan-y; }
.trend .axis text { fill: var(--ink-3); font: 10.5px var(--font-num); }
.trend .grid-line { stroke: var(--rule); stroke-width: 1; }
.trend .line-main { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend .line-ref { fill: none; stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 3 3; }
.trend .end-label { fill: var(--ink-2); font: 11px var(--font-body); }
.trend .cross { stroke: var(--ink-3); stroke-width: 1; }
.trend .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }

.others { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--rule); }
.others ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.others button {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline;
  padding: 6px 6px; border: 0; border-radius: 6px; background: none; color: var(--ink); cursor: pointer; text-align: left; font: 13px var(--font-body);
}
.others button:hover { background: var(--accent-soft); }
.others button:focus-visible { outline: 2px solid var(--accent); }
.others .ov { font: 13px var(--font-num); }
.others .orank { font: 11px var(--font-num); color: var(--ink-3); min-width: 56px; text-align: right; }

.ledger-card { padding: 16px 16px 8px; }
.ledger-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.ledger-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1 1 100%; }
.field { height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 14px var(--font-body); padding: 0 10px; min-width: 0; }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#search { flex: 1 1 140px; }
#region { flex: 0 0 auto; }
.ledger { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; border-top: 1px solid var(--rule); }
.ledger li { border-bottom: 1px solid var(--rule); }
.ledger button {
  width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr) 84px; gap: 4px 10px; align-items: center;
  padding: 8px 4px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; font: 14px var(--font-body);
}
.ledger button:hover { background: var(--accent-soft); }
.ledger button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ledger button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.ledger .rk { color: var(--ink-3); font: 12px var(--font-num); text-align: right; }
.ledger .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ledger .v { text-align: right; font: 13px var(--font-num); }
.ledger .bar { grid-column: 2 / 4; height: 4px; border-radius: 0 2px 2px 0; }
.ledger-group { padding: 12px 4px 4px; font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.ledger-foot { font-size: 12px; color: var(--ink-3); padding: 8px 2px 4px; }
.empty { padding: 14px 4px; color: var(--ink-3); font-size: 13px; }

/* Tooltip */
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); max-width: 240px; }
.tip strong { display: block; font-size: 14px; }
.tip .muted { opacity: 0.72; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>세계 지표 지구본</h1>
    <p class="tagline">지표를 고르고, 지구본을 돌려 나라를 눌러 보세요.</p>
  </header>

  <div class="grid">
    <nav class="indicators" aria-label="지표 목록">
      <ul class="ind-list" id="indList"></ul>
      <section class="about card" id="about" aria-live="polite"></section>
    </nav>

    <section class="stage" aria-label="지구본">
      <div class="globe-box" id="globeBox">
        <canvas id="globe" tabindex="0" role="img" aria-label="선택한 지표를 나라별 색으로 표시한 지구본. 방향키로 회전, +와 -로 확대·축소할 수 있습니다."></canvas>
        <div class="controls">
          <button class="ctrl" id="zoomIn" type="button" aria-label="확대">+</button>
          <button class="ctrl" id="zoomOut" type="button" aria-label="축소">−</button>
          <button class="ctrl" id="spin" type="button" aria-label="자동 회전" aria-pressed="false" title="자동 회전">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
          </button>
          <button class="ctrl" id="home" type="button" aria-label="한국으로 돌아가기" title="한국으로">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2.5M8 12v2.5M1.5 8H4M12 8h2.5"/></svg>
          </button>
        </div>
      </div>
      <div class="legend" aria-label="범례">
        <div class="legend-row" id="legendRow"></div>
        <div class="lg-extra" id="legendExtra"></div>
      </div>
    </section>

    <aside class="side">
      <article class="card sheet" id="detail" aria-live="polite"></article>
      <section class="card ledger-card" aria-labelledby="ledgerTitle">
        <div class="ledger-head">
          <h2 id="ledgerTitle">순위표</h2>
          <input class="field" id="search" type="search" placeholder="나라 이름 검색" aria-label="나라 이름 검색">
          <select class="field" id="region" aria-label="지역 선택"><option value="">전체 지역</option></select>
        </div>
        <ul class="ledger" id="ledger"></ul>
        <div class="ledger-foot" id="ledgerFoot"></div>
      </section>
    </aside>

    <section class="about card inline" id="aboutInline" aria-label="지표 설명" hidden></section>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="data/world-50m.js"></script>
<script src="data/world-110m.js"></script>
<script src="data/countries.js"></script>
<script src="data/indicators/minimum-wage.js"></script>
<script src="data/indicators/life-expectancy.js"></script>
<script src="data/indicators/gdp-per-capita.js"></script>
<script src="data/indicators/fertility.js"></script>
<script src="data/indicators/population.js"></script>
<script src="data/indicators/population-density.js"></script>
<script src="data/indicators/unemployment.js"></script>
<script src="data/indicators/co2-per-capita.js"></script>
<script>
(function () {
  "use strict";

  const TOPO = window.WORLD_TOPO;
  const COUNTRIES = window.COUNTRIES;
  const KOREA = "410";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Indicators ----------
  const INDICATORS = (window.INDICATORS || []).slice().sort((a, b) => a.order - b.order);
  INDICATORS.forEach(ind => {
    const ranked = Object.entries(ind.rows)
      .filter(([, r]) => r.status === "value")
      .map(([id, r]) => ({ id, ...r }))
      .sort((a, b) => b.value - a.value);
    ranked.forEach((r, i) => { r.rank = ind.rows[r.id].rank = i + 1; });
    ind.ranked = ranked;
    ind.none = Object.keys(ind.rows).filter(id => ind.rows[id].status === "none");
    ind.min = d3.min(ranked, r => r.value);
    ind.max = d3.max(ranked, r => r.value);
  });
  const byId = new Map(INDICATORS.map(i => [i.id, i]));
  let ind = byId.get(location.hash.slice(1)) || INDICATORS[0];

  const binOf = (i, v) => d3.bisectRight(i.thresholds, v);
  // Position of a value on the indicator's bar (0–1): log scale, linear from 0, or linear from just below the minimum.
  function barPos(i, v) {
    if (i.barScale === "log") return Math.log(v / (i.min * 0.8)) / Math.log(i.max / (i.min * 0.8));
    const lo = i.compare === "ratio" ? 0 : i.min - (i.max - i.min) * 0.08;
    return (v - lo) / (i.max - lo);
  }
  const barLow = i => i.barScale === "log" ? i.min : i.compare === "ratio" ? 0 : i.min;
  // 51563811 -> "5,156만 명", 1411369625 -> "14억 1,137만 명"
  function koCount(n) {
    if (n < 1e5) return d3.format(",.0f")(n) + "명";
    const man = Math.round(n / 1e4), eok = Math.floor(man / 1e4), rest = man % 1e4;
    return eok ? `${eok}억${rest ? " " + d3.format(",")(rest) + "만" : ""} 명` : `${d3.format(",")(rest)}만 명`;
  }
  // axis labels: 5000만, 1.5억
  function koShort(n) {
    if (n >= 1e8) return d3.format("~g")(+(n / 1e8).toFixed(1)) + "억";
    if (n >= 1e4) return d3.format(",")(Math.round(n / 1e4)) + "만";
    return d3.format(",")(n);
  }
  function fmtValue(i, v) {
    if (i.format === "count") return koCount(v);
    // whole-number indicators still show one decimal below 10 (e.g. 0.1명/km²), except money
    const dec = i.decimals === 0 && !i.prefix && Math.abs(v) < 10 ? 1 : i.decimals;
    return i.prefix + d3.format(`,.${dec}f`)(v) + i.suffix;
  }
  // compact form for narrow columns: "14.8억 명", "5,156만 명"
  const fmtShort = (i, v) => i.format === "count" ? (v < 1e4 ? koCount(v) : koShort(v) + " 명") : fmtValue(i, v);
  const nameKo = key => (COUNTRIES[key] && COUNTRIES[key].ko) || key;

  // ---------- Geography ----------
  // Two levels of detail: 1:110m while the globe moves (about 7x fewer points), 1:50m once it settles.
  // world-atlas leaves Kosovo without a numeric id; the data uses its UN code.
  const NAME_KEYS = { Kosovo: "412" };
  function loadLevel(topo) {
    const features = topojson.feature(topo, topo.objects.countries).features.filter(f => f.properties.name !== "Antarctica");
    features.forEach(f => { f.key = f.id || NAME_KEYS[f.properties.name] || f.properties.name; });
    return { features, borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b), byKey: new Map(features.map(f => [f.key, f])) };
  }
  const HI = loadLevel(TOPO);
  const LO = window.WORLD_TOPO_LO ? loadLevel(window.WORLD_TOPO_LO) : HI;
  const geoAll = HI.features;
  geoAll.forEach(f => { f.bbox = d3.geoBounds(f); });
  const featureByKey = HI.byKey;
  const labelOf = f => (COUNTRIES[f.key] ? COUNTRIES[f.key].ko : f.properties.name);

  // ---------- Colors from tokens ----------
  let colors = {}, hatchPattern = null, shading = null;
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => cs.getPropertyValue(n).trim();
    colors = {
      seq: [1, 2, 3, 4, 5, 6].map(i => g(`--seq-${i}`)),
      ocean: g("--ocean"), oceanEdge: g("--ocean-edge"), none: g("--land-none"), hatch: g("--hatch"),
      graticule: g("--graticule"), border: g("--border"), focus: g("--focus"),
      shade: g("--shade"), shine: g("--shine"), bg: g("--bg"),
    };
    hatchPattern = null; shading = null;
  }

  // ---------- Canvas globe ----------
  const canvas = document.getElementById("globe");
  const ctx = canvas.getContext("2d");
  const box = document.getElementById("globeBox");
  const projection = d3.geoOrthographic().clipAngle(90);
  const path = d3.geoPath(projection, ctx);
  const graticule = d3.geoGraticule10();
  const sphere = { type: "Sphere" };
  const ZOOM_MIN = 0.8, ZOOM_MAX = 10;
  let width = 0, height = 0, dpr = 1, baseScale = 1, zoomK = 1;
  let rotation = [-127.5, -30, 0];
  let hovered = null, selected = null, legendFocus = null;
  let moving = false, settleTimer = 0;

  // Draw coarse while anything moves; switch back to full detail ~150ms after the last movement.
  function markMoving() {
    moving = true;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { moving = false; render(); }, 150);
  }

  function resize() {
    const r = box.getBoundingClientRect();
    width = r.width; height = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    baseScale = Math.min(width, height) / 2 - 6;
    hatchPattern = null; shading = null;
    render();
  }

  // Pixel density of the canvas backing store: full while at rest, 1x while moving
  // (a 2x canvas has four times the pixels to fill on every frame).
  let px = 0;
  function setDensity(d) {
    const w = Math.round(width * d), h = Math.round(height * d);
    if (px !== d || canvas.width !== w || canvas.height !== h) {
      px = d; canvas.width = w; canvas.height = h;
      hatchPattern = null;
    }
  }

  function getHatch() {
    if (hatchPattern) return hatchPattern;
    const s = Math.round(6 * px);
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    g.fillStyle = colors.none; g.fillRect(0, 0, s, s);
    g.strokeStyle = colors.hatch; g.lineWidth = 1.2 * px;
    g.beginPath();
    g.moveTo(-1, s + 1); g.lineTo(s + 1, -1);
    g.moveTo(-1, 1); g.lineTo(1, -1);
    g.moveTo(s - 1, s + 1); g.lineTo(s + 1, s - 1);
    g.stroke();
    hatchPattern = ctx.createPattern(c, "repeat");
    return hatchPattern;
  }

  function rowOf(f) { return ind.rows[f.key] || null; }
  // Fill groups: one canvas fill per color instead of one per country.
  function fillKey(f) {
    const r = rowOf(f);
    const base = !r ? "nodata" : r.status === "none" ? "none" : "bin" + binOf(ind, r.value);
    if (legendFocus === null) return base;
    return base + (base === "bin" + legendFocus ? "" : ":dim");
  }
  function styleFor(key) {
    const k = key.replace(":dim", "");
    return k === "nodata" ? colors.none : k === "none" ? getHatch() : colors.seq[+k.slice(3)];
  }

  let frame = 0;
  function render() { if (!frame) frame = requestAnimationFrame(draw); }
  function draw() {
    frame = 0;
    if (!width) return;
    const level = moving ? LO : HI;
    projection.scale(baseScale * zoomK).translate([width / 2, height / 2]).rotate(rotation)
      .precision(moving ? 1 : 0.4);
    setDensity(moving ? 1 : dpr);
    ctx.setTransform(px, 0, 0, px, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.beginPath(); path(sphere); ctx.fillStyle = colors.ocean; ctx.fill();
    ctx.beginPath(); path(graticule); ctx.strokeStyle = colors.graticule; ctx.lineWidth = 0.6; ctx.stroke();

    const groups = new Map();
    for (const f of level.features) {
      const k = fillKey(f);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(f);
    }
    for (const [k, fs] of groups) {
      ctx.beginPath();
      for (const f of fs) path(f);
      ctx.fillStyle = styleFor(k);
      ctx.globalAlpha = k.endsWith(":dim") ? 0.22 : 1;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.beginPath(); path(level.borders); ctx.strokeStyle = colors.border; ctx.lineWidth = 0.6; ctx.stroke();

    const [cx, cy] = projection.translate();
    const rad = projection.scale();
    if (!shading || shading.rad !== rad || shading.cx !== cx) {
      const grad = ctx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.4, rad * 0.1, cx, cy, rad);
      grad.addColorStop(0, colors.shine); grad.addColorStop(0.55, "rgba(0,0,0,0)"); grad.addColorStop(1, colors.shade);
      shading = { grad, rad, cx };
    }
    ctx.beginPath(); path(sphere); ctx.fillStyle = shading.grad; ctx.fill();
    ctx.strokeStyle = colors.oceanEdge; ctx.lineWidth = 1; ctx.stroke();

    if (hovered && hovered !== selected && !moving) {
      ctx.beginPath(); path(hovered); ctx.strokeStyle = colors.focus; ctx.lineWidth = 1; ctx.stroke();
    }
    if (selected) {
      // tiny countries are missing from 1:110m; their 1:50m outline is cheap to draw
      const sel = level.byKey.get(selected.key) || selected;
      ctx.beginPath(); path(sel);
      ctx.strokeStyle = colors.bg; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = colors.focus; ctx.lineWidth = 1.8; ctx.stroke();
    }
  }

  // ---------- Hit testing ----------
  function inBox(f, lon, lat) {
    const [[x0, y0], [x1, y1]] = f.bbox;
    if (lat < y0 - 0.5 || lat > y1 + 0.5) return false;
    if (x0 <= x1) return lon >= x0 - 0.5 && lon <= x1 + 0.5;
    return lon >= x0 - 0.5 || lon <= x1 + 0.5;
  }
  function featureAt(px, py) {
    const ll = projection.invert([px, py]);
    if (!ll || isNaN(ll[0])) return null;
    if (d3.geoDistance(ll, [-rotation[0], -rotation[1]]) > Math.PI / 2) return null;
    for (const f of geoAll) if (inBox(f, ll[0], ll[1]) && d3.geoContains(f, ll)) return f;
    return null;
  }

  // ---------- Drag to rotate (with inertia), wheel / pinch to zoom ----------
  const pointers = new Map();
  let drag = null, pinch = null, dragMoved = false, spinning = false, inertiaTimer = null, zoomTimer = null;
  const clampLat = v => Math.max(-89, Math.min(89, v));
  const clampZoom = k => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, k));
  // degrees of rotation per screen pixel, so the point under the cursor follows it near the center
  const degPerPx = () => 180 / Math.PI / (baseScale * zoomK);

  function stopMotion() { stopFly(); stopInertia(); }
  function stopInertia() { if (inertiaTimer) { inertiaTimer.stop(); inertiaTimer = null; } }
  function rotateBy(dx, dy) {
    const k = degPerPx();
    rotation = [rotation[0] + dx * k, clampLat(rotation[1] - dy * k), 0];
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    stopMotion(); setSpin(false); hideTip();
    if (pointers.size === 1) {
      dragMoved = false;
      drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, samples: [{ t: e.timeStamp, x: e.clientX, y: e.clientY }] };
      canvas.classList.add("dragging");
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: zoomK };
      drag = null;
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      zoomK = clampZoom(pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0);
      dragMoved = true; markMoving(); render();
      return;
    }
    if (!drag) return;
    // use every coalesced sample so fast drags stay accurate
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (evs.length ? evs : [e])) {
      rotateBy(ev.clientX - drag.x, ev.clientY - drag.y);
      drag.x = ev.clientX; drag.y = ev.clientY;
      drag.samples.push({ t: ev.timeStamp, x: ev.clientX, y: ev.clientY });
    }
    while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > 80) drag.samples.shift();
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) dragMoved = true;
    markMoving(); render();
  });

  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      canvas.classList.remove("dragging");
      if (drag && dragMoved && !reduceMotion) startInertia(drag.samples, e.timeStamp);
      drag = null;
    } else if (pointers.size === 1) {
      // lifting one finger of a pinch continues as a drag with the remaining finger
      const [p] = [...pointers.values()];
      drag = { x: p.x, y: p.y, x0: p.x, y0: p.y, samples: [{ t: e.timeStamp, x: p.x, y: p.y }] };
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  // Keep turning after release, slowing down with exponential friction.
  function startInertia(samples, now) {
    const first = samples[0], last = samples[samples.length - 1];
    const dt = last.t - first.t;
    if (dt <= 0 || now - last.t > 60) return;  // the pointer paused before release
    let vx = (last.x - first.x) / dt, vy = (last.y - first.y) / dt;  // px per ms
    if (Math.hypot(vx, vy) < 0.05) return;
    stopInertia();
    let prev = 0;
    inertiaTimer = d3.timer((elapsed) => {
      const step = Math.min(elapsed - prev, 32); prev = elapsed;
      const decay = Math.exp(-step / 325);
      vx *= decay; vy *= decay;
      rotateBy(vx * step, vy * step);
      markMoving(); render();
      if (Math.hypot(vx, vy) < 0.01) stopInertia();
    });
  }

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    stopMotion();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    zoomK = clampZoom(zoomK * Math.exp(-e.deltaY * unit * 0.0015));
    markMoving(); render();
  }, { passive: false });

  function zoomBy(f) {
    if (zoomTimer) zoomTimer.stop();
    const from = zoomK, to = clampZoom(zoomK * f);
    if (reduceMotion) { zoomK = to; render(); return; }
    zoomTimer = d3.timer((el) => {
      const t = Math.min(1, el / 250);
      zoomK = from * Math.pow(to / from, d3.easeCubicOut(t));
      markMoving(); render();
      if (t >= 1) { zoomTimer.stop(); zoomTimer = null; }
    });
  }
  document.getElementById("zoomIn").addEventListener("click", () => zoomBy(1.5));
  document.getElementById("zoomOut").addEventListener("click", () => zoomBy(1 / 1.5));
  document.getElementById("home").addEventListener("click", () => select(featureByKey.get(KOREA), true));
  canvas.addEventListener("keydown", (e) => {
    const step = 8 / zoomK;
    const map = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (map[e.key]) {
      e.preventDefault(); setSpin(false); stopMotion();
      rotation = [rotation[0] + map[e.key][0], clampLat(rotation[1] + map[e.key][1]), 0];
      markMoving(); render();
    } else if (e.key === "+" || e.key === "=") zoomBy(1.5);
    else if (e.key === "-") zoomBy(1 / 1.5);
  });

  // ---------- Tooltip ----------
  const tip = document.getElementById("tip");
  let pending = null;
  canvas.addEventListener("pointermove", (e) => {
    if (e.buttons || moving || pointers.size) return;
    pending = e;
    requestAnimationFrame(() => {
      if (!pending) return;
      const ev = pending; pending = null;
      const r = canvas.getBoundingClientRect();
      const f = featureAt(ev.clientX - r.left, ev.clientY - r.top);
      if (f !== hovered) { hovered = f; render(); }
      if (f) showTip(f, ev.clientX, ev.clientY); else hideTip();
    });
  });
  canvas.addEventListener("pointerleave", () => { hovered = null; hideTip(); render(); });
  canvas.addEventListener("click", (e) => {
    if (dragMoved) return;
    const r = canvas.getBoundingClientRect();
    const f = featureAt(e.clientX - r.left, e.clientY - r.top);
    if (f) select(f, false);
  });
  function showTip(f, x, y) {
    const r = rowOf(f);
    let html = `<strong>${labelOf(f)}</strong>`;
    if (!r) html += `<span class="muted">자료 없음</span>`;
    else if (r.status === "none") html += `<span class="muted">${ind.noneLabel}</span>`;
    else html += `<span class="num">${fmtValue(ind, r.value)}${ind.bigUnit && ind.bigUnit.startsWith("/") ? " " + ind.bigUnit : ""}</span>` +
      (r.tip ? `<br><span class="muted num">${r.tip}</span>` : "");
    tip.innerHTML = html;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = x + 14, top = y + 14;
    if (left + tw > window.innerWidth - 8) left = x - tw - 14;
    if (top + th > window.innerHeight - 8) top = y - th - 14;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  function hideTip() { tip.hidden = true; }

  // ---------- Fly to ----------
  function focusPoint(f) {
    let geom = f.geometry;
    if (geom.type === "MultiPolygon") {
      let best = null, bestArea = -1;
      for (const coords of geom.coordinates) {
        const poly = { type: "Polygon", coordinates: coords };
        const a = d3.geoArea(poly);
        if (a > bestArea) { bestArea = a; best = poly; }
      }
      geom = best;
    }
    return d3.geoCentroid(geom);
  }
  let flyTimer = null;
  function stopFly() { if (flyTimer) { flyTimer.stop(); flyTimer = null; } }
  function flyTo(f) {
    stopMotion();
    const [lon, lat] = focusPoint(f);
    const target = [-lon, clampLat(-lat), 0];
    const d = ((target[0] - rotation[0] + 540) % 360) - 180;
    target[0] = rotation[0] + d;
    if (reduceMotion) { rotation = target; render(); return; }
    const interp = d3.interpolate(rotation.slice(), target);
    const dur = 650 + Math.min(900, Math.hypot(d, target[1] - rotation[1]) * 5);
    flyTimer = d3.timer((elapsed) => {
      const t = Math.min(1, elapsed / dur);
      rotation = interp(d3.easeCubicInOut(t));
      markMoving(); render();
      if (t >= 1) stopFly();
    });
  }

  // ---------- Auto-spin ----------
  let spinTimer = null;
  const spinBtn = document.getElementById("spin");
  function setSpin(on) {
    spinning = on;
    spinBtn.setAttribute("aria-pressed", String(on));
    if (spinTimer) { spinTimer.stop(); spinTimer = null; }
    if (on) {
      stopMotion();
      let last = 0;
      spinTimer = d3.timer((el) => { rotation = [rotation[0] + (el - last) * 0.006, rotation[1], 0]; last = el; markMoving(); render(); });
    }
  }
  spinBtn.addEventListener("click", () => setSpin(!spinning));

  // ---------- Left: indicator list & about ----------
  const indList = document.getElementById("indList");
  function renderIndicators() {
    indList.innerHTML = INDICATORS.map(i => `
      <li><button type="button" class="ind-btn" data-ind="${i.id}" aria-pressed="${i === ind}">
        <span class="ind-name">${i.name}</span><span class="ind-group">${i.group}</span>
        <span class="ind-meta">${i.asOf} · ${i.ranked.length}개 국가·지역</span>
      </button></li>`).join("");
  }
  indList.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ind]");
    if (b) setIndicator(byId.get(b.dataset.ind));
  });

  function aboutHtml(i) {
    return `
      <h2>${i.longName}</h2>
      <p>${i.summary}.</p>
      <h3>계산 방법</h3>
      ${i.method.map(m => `<p>${m}</p>`).join("")}
      <h3>출처</h3>
      <ul>${i.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a></li>`).join("")}
        <li>지도: Natural Earth 1:50m (world-atlas)</li></ul>`;
  }
  const about = document.getElementById("about");
  const aboutInline = document.getElementById("aboutInline");
  const narrow = window.matchMedia("(max-width: 1180px)");
  function renderAbout() {
    about.innerHTML = aboutHtml(ind);
    aboutInline.innerHTML = aboutHtml(ind);
    aboutInline.hidden = !narrow.matches;
  }
  narrow.addEventListener("change", renderAbout);

  // ---------- Center: heading & legend ----------
  function renderStage() {
    document.getElementById("legendRow").innerHTML = ind.binLabels.map((l, i) => `
      <button type="button" class="lg-item" data-bin="${i}" aria-label="${l} 구간 강조">
        <span class="lg-swatch" style="background:${colors.seq[i]}"></span><span>${l}</span>
      </button>`).join("");
    document.getElementById("legendExtra").innerHTML =
      (ind.noneLabel ? `<span><i class="chip none"></i>${ind.noneLabel}</span>` : "") +
      `<span><i class="chip nodata"></i>자료 없음</span>`;
  }
  const legendRow = document.getElementById("legendRow");
  legendRow.addEventListener("pointerover", (e) => { const b = e.target.closest("[data-bin]"); if (b) { legendFocus = +b.dataset.bin; render(); } });
  legendRow.addEventListener("pointerout", (e) => { if (!legendRow.contains(e.relatedTarget)) { legendFocus = null; render(); } });
  legendRow.addEventListener("focusin", (e) => { const b = e.target.closest("[data-bin]"); if (b) { legendFocus = +b.dataset.bin; render(); } });
  legendRow.addEventListener("focusout", () => { legendFocus = null; render(); });

  // ---------- Right: country sheet ----------
  const detail = document.getElementById("detail");
  function compareHtml(r, key) {
    const k = ind.rows[KOREA];
    if (!k || k.status !== "value") return "";
    const pct = v => (Math.max(0, Math.min(1, barPos(ind, v))) * 100).toFixed(1);
    let text;
    if (key === KOREA) text = "비교 기준 국가 (막대의 세로선이 한국)";
    else if (ind.compare === "ratio") {
      const q = r.value / k.value;
      text = `한국(${fmtValue(ind, k.value)})의 <b class="num">${q >= 2 ? d3.format(",.1f")(q) + "배" : d3.format(".0%")(q)}</b>${q >= 2 ? "" : " 수준"}`;
    }
    else {
      const d = r.value - k.value;
      text = Math.abs(d) < 0.05 ? `한국(${fmtValue(ind, k.value)})과 같음`
        : `한국(${fmtValue(ind, k.value)})보다 <b class="num">${ind.diffSuffix ? d3.format(`,.${ind.decimals}f`)(Math.abs(d)) + ind.diffSuffix : fmtValue(ind, Math.abs(d))}</b> ${d > 0 ? "높음" : "낮음"}`;
    }
    const lo = barLow(ind);
    return `<p class="compare">${text}</p>
      <div class="compare-bar" aria-hidden="true"><i style="width:${pct(r.value)}%"></i><b style="left:calc(${pct(k.value)}% - 1px)"></b></div>
      <div class="compare-scale" aria-hidden="true"><span>${fmtValue(ind, lo)}</span><span>${fmtValue(ind, ind.max)}</span></div>`;
  }

  function othersHtml(key) {
    const others = INDICATORS.filter(i => i !== ind);
    if (!others.length) return "";
    return `<div class="others"><ul>${others.map(i => {
      const r = i.rows[key];
      const val = !r ? "자료 없음" : r.status === "none" ? "없음" : fmtValue(i, r.value);
      const rk = r && r.status === "value" ? `${r.rank} / ${i.ranked.length}위` : "";
      return `<li><button type="button" data-ind="${i.id}" title="${i.name} 지표로 바꾸기"><span>${i.name}</span><span class="ov">${val}</span><span class="orank">${rk}</span></button></li>`;
    }).join("")}</ul></div>`;
  }
  detail.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ind]");
    if (b) setIndicator(byId.get(b.dataset.ind));
  });

  function renderDetail() {
    const f = selected;
    const key = f.key;
    const c = COUNTRIES[key];
    const name = labelOf(f);
    const en = c ? `${c.en} · ${c.region}` : f.properties.name;
    const r = ind.rows[key];
    let body;
    if (!r) body = `<p class="status-none">${ind.name} 자료가 없는 나라입니다.</p>`;
    else if (r.status === "none") body = `<p class="status-none">${ind.noneLabel}</p>${r.note ? `<p class="note">${r.note}</p>` : ""}`;
    else body = `
      <div class="big"><span class="val">${fmtValue(ind, r.value)}</span>${ind.bigUnit && ind.bigUnit.startsWith("/") ? `<span class="unit">${ind.bigUnit}</span>` : ""}</div>
      ${compareHtml(r, key)}
      ${r.series ? `<div class="trend" id="trend"></div>` : ""}
      <dl class="slip">${r.details.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      ${r.note ? `<p class="note">${r.note}</p>` : ""}`;
    const rank = r && r.status === "value" ? `<span class="rank-pill">${r.rank} / ${ind.ranked.length}위</span>` : "";
    detail.innerHTML = `
      <div class="detail-head"><div><h2 class="detail-name">${name}</h2><div class="detail-en">${en}</div></div>${rank}</div>
      ${body}
      ${othersHtml(key)}`;
    if (r && r.series) drawTrend(document.getElementById("trend"), key, r.series);
  }

  // Trend chart: selected country (solid) vs Korea (dashed), with a hover crosshair.
  function drawTrend(el, key, series) {
    const W = el.clientWidth || 320, H = 132, m = { t: 8, r: 58, b: 22, l: 36 };
    const selName = labelOf(selected).length > 5 ? labelOf(selected).slice(0, 5) + "…" : labelOf(selected);
    const ok = p => p[1] != null;
    const pts = series.values.map((v, i) => [series.start + i, v]);
    const years = [series.start, series.start + series.values.length - 1];
    const kr = key !== KOREA && ind.rows[KOREA] && ind.rows[KOREA].series;
    const kpts = kr ? kr.values.map((v, i) => [kr.start + i, v]).filter(p => ok(p) && p[0] >= years[0] && p[0] <= years[1]) : null;
    const all = pts.filter(ok).concat(kpts || []);
    const x = d3.scaleLinear().domain(years).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain(d3.extent(all, p => p[1])).nice(4).range([H - m.b, m.t]);
    const line = d3.line().defined(ok).x(p => x(p[0])).y(p => y(p[1]));
    const last = pts.filter(ok).pop();
    const kLast = kpts && kpts.length ? kpts[kpts.length - 1] : null;
    const yFmt = ind.format === "count" ? koShort : y.domain()[1] >= 10000 ? d3.format("~s") : d3.format("~g");
    const xTicks = [years[0], ...x.ticks(4).filter(t => t - years[0] >= (years[1] - years[0]) * 0.18 && years[1] - t >= (years[1] - years[0]) * 0.18), years[1]];
    const nudge = kLast && Math.abs(y(last[1]) - y(kLast[1])) < 12 ? (last[1] < kLast[1] ? 14 : -6) : 4;
    el.innerHTML = `
      <div class="trend-head"><span class="label">${ind.seriesLabel} (${years[0]}–${years[1]})</span><span class="trend-read" id="trendRead"></span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${labelOf(selected)} ${ind.seriesLabel}">
        <g class="axis">${y.ticks(4).map(t => `<line class="grid-line" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 6}" y="${y(t) + 3.5}" text-anchor="end">${yFmt(t)}</text>`).join("")}
          ${xTicks.map(t => `<text x="${x(t)}" y="${H - 3}" text-anchor="middle">${t}</text>`).join("")}</g>
        ${kLast ? `<path class="line-ref" d="${line(kpts)}"/><text class="end-label" x="${x(kLast[0]) + 4}" y="${y(kLast[1]) + 4}">한국</text>` : ""}
        <path class="line-main" d="${line(pts)}"/>
        <text class="end-label" x="${x(last[0]) + 4}" y="${y(last[1]) + nudge}">${selName}</text>
        <line class="cross" id="cross" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>
        <circle class="dot" id="dot" r="4" visibility="hidden"/>
        <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent" id="hit"/>
      </svg>`;
    const svg = el.querySelector("svg"), cross = el.querySelector("#cross"), dot = el.querySelector("#dot"), read = el.querySelector("#trendRead");
    const show = (clientX) => {
      const b = svg.getBoundingClientRect();
      const px = (clientX - b.left) * (W / b.width);
      const yr = Math.round(Math.max(years[0], Math.min(years[1], x.invert(px))));
      const v = series.values[yr - series.start];
      cross.setAttribute("x1", x(yr)); cross.setAttribute("x2", x(yr)); cross.setAttribute("visibility", "visible");
      if (v != null) { dot.setAttribute("cx", x(yr)); dot.setAttribute("cy", y(v)); dot.setAttribute("visibility", "visible"); }
      else dot.setAttribute("visibility", "hidden");
      const kv = kr ? kr.values[yr - kr.start] : null;
      read.textContent = `${yr}년 ${v != null ? fmtValue(ind, v) : "자료 없음"}` + (kv != null ? ` · 한국 ${fmtValue(ind, kv)}` : "");
    };
    const hide = () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); read.textContent = ""; };
    const hit = el.querySelector("#hit");
    hit.addEventListener("pointermove", e => show(e.clientX));
    hit.addEventListener("pointerdown", e => show(e.clientX));
    hit.addEventListener("pointerleave", hide);
  }


  // ---------- Right: ledger ----------
  const ledger = document.getElementById("ledger");
  const search = document.getElementById("search");
  const regionSel = document.getElementById("region");
  [...new Set(Object.values(COUNTRIES).map(c => c.region))].filter(Boolean)
    .sort((a, b) => a.localeCompare(b, "ko"))
    .forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; regionSel.appendChild(o); });

  function renderLedger() {
    const q = search.value.trim().toLowerCase();
    const reg = regionSel.value;
    const match = id => {
      const c = COUNTRIES[id] || { ko: id, en: id, region: "" };
      return (!reg || c.region === reg) && (!q || c.ko.toLowerCase().includes(q) || c.en.toLowerCase().includes(q));
    };
    const rows = ind.ranked.filter(r => match(r.id));
    const nones = ind.none.filter(match);
    const selKey = selected ? selected.key : null;
    let html = rows.map(r => `
      <li><button type="button" data-key="${r.id}" ${r.id === selKey ? 'aria-current="true"' : ""}>
        <span class="rk">${r.rank}</span><span class="nm">${nameKo(r.id)}</span><span class="v">${fmtShort(ind, r.value)}</span>
        <span class="bar" style="width:${Math.max(1, barPos(ind, r.value) * 100).toFixed(1)}%;background:${colors.seq[binOf(ind, r.value)]}"></span>
      </button></li>`).join("");
    if (nones.length) {
      html += `<li class="ledger-group" aria-hidden="true">${ind.noneLabel}</li>` + nones.map(id => `
        <li><button type="button" data-key="${id}" ${id === selKey ? 'aria-current="true"' : ""}>
          <span class="rk">–</span><span class="nm">${nameKo(id)}</span><span class="v">없음</span></button></li>`).join("");
    }
    if (!rows.length && !nones.length) html = `<li class="empty">맞는 나라가 없습니다. 검색어나 지역을 바꿔 보세요.</li>`;
    ledger.innerHTML = html;
    document.getElementById("ledgerTitle").textContent = `${ind.name} 순위${ind.rankLabel ? ` (${ind.rankLabel})` : ""}`;
    document.getElementById("ledgerFoot").textContent = ind.barScale === "log"
      ? "값의 차이가 커서 막대는 로그 눈금으로 그립니다."
      : ind.compare === "ratio" ? "막대는 0부터 최댓값까지의 비율입니다."
      : `막대는 최솟값(${fmtValue(ind, ind.min)}) 근처부터 그립니다.`;
  }
  ledger.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-key]");
    if (!b) return;
    const f = featureByKey.get(b.dataset.key);
    if (f) select(f, true);
  });
  search.addEventListener("input", renderLedger);
  regionSel.addEventListener("change", renderLedger);

  function scrollLedgerToSelection() {
    const cur = ledger.querySelector('[aria-current="true"]');
    if (!cur) return;
    const top = cur.offsetTop - ledger.offsetTop;
    if (top < ledger.scrollTop || top > ledger.scrollTop + ledger.clientHeight - cur.offsetHeight) {
      ledger.scrollTop = top - ledger.clientHeight / 2 + cur.offsetHeight / 2;
    }
  }

  // ---------- State changes ----------
  function select(f, fly) {
    selected = f;
    renderDetail();
    renderLedger();
    scrollLedgerToSelection();
    if (fly) { setSpin(false); flyTo(f); }
    render();
  }

  function setIndicator(next) {
    if (!next) return;
    ind = next;
    legendFocus = null;
    try { history.replaceState(null, "", "#" + ind.id); } catch (_) { /* sandboxed frames may refuse */ }
    renderIndicators();
    renderAbout();
    renderStage();
    renderDetail();
    renderLedger();
    scrollLedgerToSelection();
    render();
  }

  function onTheme() { readColors(); setIndicator(ind); }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("hashchange", () => setIndicator(byId.get(location.hash.slice(1))));

  // ---------- Boot ----------
  readColors();
  selected = featureByKey.get(KOREA);
  setIndicator(ind);
  new ResizeObserver(resize).observe(box);
  // keep the trend chart's viewBox in step with its card width
  let lastSide = 0;
  new ResizeObserver(([e]) => {
    const w = Math.round(e.contentRect.width);
    if (w !== lastSide) { lastSide = w; if (document.getElementById("trend")) renderDetail(); }
  }).observe(detail);
  resize();
})();
</script>
</body>
</html>
